services:
  app:                      # the agent, plus the reference calendar MCP server at /mcp-calendar
    build: .
    env_file:
      - path: .env        # cp .env.example .env first; optional so `docker compose config` works on a clean clone
        required: false
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      MCP_TOKEN: "${MCP_TOKEN:-change-me-calendar-token}"
    restart: unless-stopped
